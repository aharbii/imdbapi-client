[project]
name = "imdbapi-client"
version = "0.1.0"
description = "Production-ready async Python client for imdbapi.dev — free IMDb REST API"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["imdb", "movies", "api", "client", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
lint = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "pytest-cov>=6.0.0",
]
dev = [
    "pre-commit>=4.0.0",
    { include-group = "lint" },
    { include-group = "test" },
]
# AI agent integrations — install the LLM provider you use:
#   uv sync --group agents-anthropic   (Claude)
#   uv sync --group agents-openai      (GPT)
agents-anthropic = [
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "load-dotenv>=0.1.0",
    "langchain>=1.2.13",
]
agents-openai = [
    "langchain>=1.2.13",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "load-dotenv>=0.1.0",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imdbapi"]

[tool.ruff.lint.per-file-ignores]
# LangChain integration uses Any extensively for tool return types
"src/imdbapi/langchain/*" = ["ANN401"]
# _CAMEL_MAP in _missing_() is an intentional lookup constant, not a variable
"src/imdbapi/models/title.py" = ["N806"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N818", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["imdbapi"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# pytest fixtures and marks are not fully typed; relax decorator checks for tests
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# TitlesEndpoint has a method named `list` which shadows the builtin in class body
# annotations, even with `from __future__ import annotations`.
module = "imdbapi.endpoints.titles"
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
# langchain_core stubs are incomplete — BaseTool resolves to Any, which causes
# "Class cannot subclass X (has type Any)" on every tool class definition.
module = "imdbapi.langchain.tools"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# langchain_anthropic stubs require `timeout` and `stop` as positional args in
# one overload; at runtime these are optional kwargs. Suppress the false positive.
module = "imdbapi.langchain.agent"
disable_error_code = ["call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/py.typed"]

[tool.coverage.report]
show_missing = true
