[project]
name = "imdbapi-client"
version = "0.1.0"
description = "Production-ready async Python client for imdbapi.dev — free IMDb REST API"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
keywords = ["imdb", "movies", "api", "client", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28.0", "pydantic>=2.12.5", "tenacity>=9.0.0"]

[dependency-groups]
lint = ["ruff>=0.15.9", "mypy>=1.20.0"]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "pytest-cov>=6.0.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit>=4.5.1",
    "detect-secrets>=1.5.0",
]

agents-anthropic = [
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "load-dotenv>=0.1.0",
    "langchain>=1.2.13",
]
agents-openai = [
    "langchain>=1.2.13",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "load-dotenv>=0.1.0",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imdbapi"]

[tool.ruff.lint.per-file-ignores]
# LangChain integration uses Any extensively for tool return types
"src/imdbapi/langchain/*" = ["ANN401"]
# _CAMEL_MAP in _missing_() is an intentional lookup constant, not a variable
"src/imdbapi/models/title.py" = ["N806"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["imdbapi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
mypy_path = "src:tests:examples"
strict = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# TitlesEndpoint has a method named `list` which mypy confuses with the builtin
# `list` type in class body annotations, even with `from __future__ import annotations`.
module = "imdbapi.endpoints.titles"
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
# langchain_anthropic stubs require `timeout` and `stop` as positional args in
# one overload; at runtime these are optional kwargs. Suppress the false positive
# across the imdbapi agent that instantiates ChatAnthropic.
module = "imdbapi.langchain.agent"
disable_error_code = ["call-arg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "examples/*", "*/py.typed"]

[tool.coverage.report]
show_missing = true
